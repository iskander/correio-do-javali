<style>

:root{

}
[hidden]{display:none!important}

*,*::before,*::after{box-sizing:border-box}

button{font-family:var(--f-ui)}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.stage{position:relative;width:min(100%,calc((100dvh - 200px)*1.6667));min-width:min(100%,300px);aspect-ratio:320/192;max-width:100%;container-type:inline-size;
 border:4px solid var(--wood-dk);box-shadow:0 0 0 4px var(--wood-md),0 0 0 7px var(--wood-dk),0 10px 30px rgba(0,0,0,.6);background:#000;overflow:hidden}

#dlgOpts button.sel,#dlgOpts button:hover{background:var(--parch-dk);border-color:var(--wood-lt)}

.card,.panel,.tvCard{background:var(--parch);color:var(--ink);border:4px solid var(--wood);box-shadow:inset 0 0 0 3px var(--wood-lt),inset 0 0 0 6px var(--parch-dk),0 6px 0 rgba(0,0,0,.45);font-size:clamp(11px,1.9cqw,18px);max-height:100%;overflow:auto}
